<!DOCTYPE html>

<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title></title>
        <meta name="description" content="">
        <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&display=swap" rel="stylesheet">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <style>
        body {
            background-image: url("loginpage.jpg");
            background-repeat: no-repeat;
            box-sizing: border-box;
        }
            
        .log{
            display: flexbox;
            justify-content: center;
            margin:120px 0px 0px 25px;
            
        }
        .in{
            border:none;
            background: transparent;
            cursor:pointer;
            font-size: 20px;
            color:white;
            font-family: 'Orbitron', sans-serif;
        }
         .up{
            border:none;
            background: transparent;
            cursor:pointer;     
            font-size: 20px;
            color:white;
            font-family: 'Orbitron', sans-serif;
        }
        iframe{
            border-radius: 10px;
        }
    </style>
    </head>
    <body>
    <center>
    <div class="log">
<button class="in" onclick="signin()">Sign In</button> 
<button class="up" onclick="signup()">Sign Up</button>
<br><br>
<div class="main" id="fra"></div>
    </div>
    </center>  
    <script>
  
  document.getElementById("fra").innerHTML =
    `<iframe src="signin.html" width="380" height="461"></iframe>`;

  function signin() 
  {
    document.getElementById("fra").innerHTML =
      `<iframe src="signin.html" width="380" height="461"></iframe>`;
}

  function signup()
  {
    document.getElementById("fra").innerHTML =
      `<iframe src="signup.html" width="380" height="451"></iframe>`;
 }
</script>
    </script>
    </body>
</html>
